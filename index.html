<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mulheres Negras no Esporte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@1,500&family=Roboto:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="fontes.js"></script>
  </head>
  <body>
    <main class="pagina" id="pagina"></main>

    <script>
      const pagina = document.getElementById("pagina");

      function el(tag, classe, texto, filhos) {
        const e = document.createElement(tag);
        if (classe) e.className = classe;
        if (texto) e.textContent = texto;
        (filhos || []).forEach((f) => e.append(f));
        return e;
      }

      // Aceita **negrito** dentro dos textos
      function rico(texto, pai) {
        texto.split(/(\*\*[^*]+\*\*)/).forEach((parte) => {
          if (parte.startsWith("**") && parte.endsWith("**")) {
            pai.append(el("strong", "", parte.slice(2, -2)));
          } else if (parte) {
            pai.append(parte);
          }
        });
      }

      function paragrafo(txt) {
        if (txt.startsWith("> ")) {
          const b = el("blockquote");
          rico(txt.slice(2), b);
          return b;
        }
        const p = el("p");
        rico(txt, p);
        return p;
      }

      /* ---------- MEDALHAS (SVG com fundo transparente) ---------- */
      const CORES_MEDALHA = {
        ouro: {
          nome: "Ouro",
          n: "1",
          fita: "#e5383b",
          lista: "#ffd166",
          d1: "#ffd35c",
          d2: "#e8a317",
          interior: "#b9650f",
          num: "#f6b84b",
          folha: "#c9822a",
        },
        prata: {
          nome: "Prata",
          n: "2",
          fita: "#2f7fe8",
          lista: "#e6edf5",
          d1: "#bcc2c9",
          d2: "#7d848b",
          interior: "#80878e",
          num: "#eceff2",
          folha: "#b9bfc6",
        },
        bronze: {
          nome: "Bronze",
          n: "3",
          fita: "#a8510c",
          lista: "#f2a64b",
          d1: "#e8a05a",
          d2: "#b8651b",
          interior: "#a85a13",
          num: "#f5b571",
          folha: "#d8924a",
        },
      };
      let contadorMedalha = 0;

      function medalha(tipo) {
        const c = CORES_MEDALHA[tipo];
        if (!c) return null;
        const id = "mg" + ++contadorMedalha;

        // borda ondulada do disco
        const pts = [];
        for (let a = 0; a < 360; a += 3) {
          const rad = (a * Math.PI) / 180;
          const r = 33 + 2.4 * Math.sin((a * 16 * Math.PI) / 180);
          pts.push(
            (50 + r * Math.cos(rad)).toFixed(1) +
              "," +
              (72 + r * Math.sin(rad)).toFixed(1),
          );
        }

        // folhas de louro (esquerda e direita)
        let folhas = "";
        for (let i = 0; i < 4; i++) {
          const ang = 125 + i * 12;
          const rad = (ang * Math.PI) / 180;
          const x = 50 + 20 * Math.cos(rad);
          const y = 72 + 20 * Math.sin(rad);
          folhas +=
            '<ellipse cx="' +
            x.toFixed(1) +
            '" cy="' +
            y.toFixed(1) +
            '" rx="4" ry="1.8" fill="' +
            c.folha +
            '" transform="rotate(' +
            (ang + 90) +
            " " +
            x.toFixed(1) +
            " " +
            y.toFixed(1) +
            ')"/>';
          const xe = 100 - x;
          folhas +=
            '<ellipse cx="' +
            xe.toFixed(1) +
            '" cy="' +
            y.toFixed(1) +
            '" rx="4" ry="1.8" fill="' +
            c.folha +
            '" transform="rotate(' +
            -(ang + 90) +
            " " +
            xe.toFixed(1) +
            " " +
            y.toFixed(1) +
            ')"/>';
        }

        const svg =
          '<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
          '<defs><linearGradient id="' +
          id +
          '" x1="0" y1="0" x2="1" y2="1">' +
          '<stop offset="0" stop-color="' +
          c.d1 +
          '"/><stop offset="1" stop-color="' +
          c.d2 +
          '"/>' +
          "</linearGradient></defs>" +
          // fitas
          '<polygon points="11,3 29,3 56,47 44,53" fill="' +
          c.fita +
          '"/>' +
          '<polygon points="89,3 71,3 44,47 56,53" fill="' +
          c.fita +
          '"/>' +
          '<line x1="17" y1="3" x2="47" y2="50" stroke="' +
          c.lista +
          '" stroke-width="2.4"/>' +
          '<line x1="23" y1="3" x2="53" y2="50" stroke="' +
          c.lista +
          '" stroke-width="2.4"/>' +
          '<line x1="83" y1="3" x2="53" y2="50" stroke="' +
          c.lista +
          '" stroke-width="2.4"/>' +
          '<line x1="77" y1="3" x2="47" y2="50" stroke="' +
          c.lista +
          '" stroke-width="2.4"/>' +
          // disco
          '<polygon points="' +
          pts.join(" ") +
          '" fill="url(#' +
          id +
          ')"/>' +
          '<circle cx="50" cy="72" r="25" fill="' +
          c.interior +
          '" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>' +
          '<text x="50" y="81" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="' +
          c.num +
          '">' +
          c.n +
          "</text>" +
          folhas +
          "</svg>";

        const span = el("span", "medalha");
        span.innerHTML = svg; // conteúdo fixo, gerado aqui (não vem da URL)
        span.setAttribute("role", "img");
        span.setAttribute("aria-label", "Medalha de " + c.nome.toLowerCase());
        return span;
      }

      function quadroMedalhas(q) {
        const itens = ["ouro", "prata", "bronze"]
          .filter((t) => q[t] > 0)
          .map((t) =>
            el("div", "quadro-item", "", [
              medalha(t),
              el("strong", "", String(q[t])),
            ]),
          );
        if (!itens.length) return null;
        return el("div", "quadro", "", [
          el("p", "quadro-titulo", "Medalhas olímpicas"),
          el("div", "quadro-linha", "", itens),
        ]);
      }

      function naoEncontrada() {
        pagina.replaceChildren(
          el("div", "aviso", "", [
            el("h1", "", "Atleta não encontrada"),
            el("p", "", "Escaneie o QR code do banner novamente."),
          ]),
        );
      }

      /* ---------- NOME: encolhe até caber ao lado da foto ---------- */
      function ajustarNome() {
        const bloco = document.querySelector(".nome-bloco");
        const nome = bloco && bloco.querySelector(".nome");
        if (!nome) return;
        const foto = bloco.querySelector(".foto");
        const pad = parseFloat(getComputedStyle(bloco).paddingLeft) || 0;

        let disponivel = bloco.clientWidth - pad * 2;
        if (foto && getComputedStyle(foto).position === "absolute") {
          disponivel = Math.min(disponivel, foto.offsetLeft - 18 - pad);
        }

        const BASE = 100;
        nome.style.fontSize = BASE + "px";
        let maior = 0;
        nome.querySelectorAll(".txt").forEach((t) => {
          maior = Math.max(maior, t.offsetWidth);
        });
        if (!maior) return;
        const MAX = 131;
        const MIN = 32;
        nome.style.fontSize =
          Math.max(MIN, Math.min(MAX, (disponivel * BASE) / maior)) + "px";
      }
      window.addEventListener("resize", ajustarNome);

      /* ---------- GALERIA: colagem de fotos na lateral ---------- */
      // Procura as fotos listadas em "galeria" (arquivo da atleta). Se a lista
      // não existir, usa fotos/<nome>-2, -3 e -4 (jpg, jpeg, png ou webp).
      // Fotos que não existem são ignoradas; sem nenhuma, a colagem some.
      // Para ver a colagem sem ter as fotos, abra a página com &demo=1 no
      // endereço: a foto principal é usada no lugar das que faltam.
      const EXTENSOES = ["jpg", "jpeg", "png", "webp"];
      const MODO_DEMO = new URLSearchParams(window.location.search).has("demo");

      // Enfeites da colagem: cada atleta ganha o ícone da sua modalidade.
      // Para forçar outro, coloque no arquivo da atleta, por exemplo:
      //   icone: "futebol",
      // Opções: handebol, futebol, atletismo, basquete, volei, tenis,
      //         ginastica, natacao, golfe, judo, estrela
      function poligono(cx, cy, r, n, rot) {
        const pts = [];
        for (let i = 0; i < n; i++) {
          const ang = ((rot + (360 / n) * i) * Math.PI) / 180;
          pts.push(
            (cx + r * Math.cos(ang)).toFixed(1) +
              "," +
              (cy + r * Math.sin(ang)).toFixed(1),
          );
        }
        return pts.join(" ");
      }

      function bolaFutebol() {
        let s =
          '<circle cx="50" cy="50" r="42" fill="#fff" stroke="#111" stroke-width="4"/>' +
          '<polygon points="' +
          poligono(50, 50, 15, 5, -90) +
          '" fill="#111" stroke="none"/>';
        for (let i = 0; i < 5; i++) {
          const a = ((-90 + 72 * i) * Math.PI) / 180;
          const x1 = 50 + 15 * Math.cos(a);
          const y1 = 50 + 15 * Math.sin(a);
          const x2 = 50 + 26 * Math.cos(a);
          const y2 = 50 + 26 * Math.sin(a);
          s +=
            '<path d="M' +
            x1.toFixed(1) +
            " " +
            y1.toFixed(1) +
            " L" +
            x2.toFixed(1) +
            " " +
            y2.toFixed(1) +
            '" stroke="#111" stroke-width="3.5"/>';
          const cx = 50 + 34 * Math.cos(a);
          const cy = 50 + 34 * Math.sin(a);
          s +=
            '<polygon points="' +
            poligono(cx, cy, 7, 5, -90 + 72 * i + 180) +
            '" fill="#111" stroke="none"/>';
        }
        return s;
      }

      const ICONES = {
        handebol:
          '<circle cx="50" cy="50" r="42" fill="#fff" stroke="#c1121f" stroke-width="4"/>' +
          '<path d="M50 8 C34 30 34 70 50 92 C66 70 66 30 50 8 Z" fill="#c1121f" stroke="none"/>' +
          '<path d="M9 36 C34 46 66 46 91 36 M9 64 C34 54 66 54 91 64" stroke="#c1121f" stroke-width="3.5"/>',
        futebol: bolaFutebol(),
        atletismo:
          '<g stroke="#111" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">' +
          '<circle cx="64" cy="16" r="8" fill="#111" stroke="none"/>' +
          '<path d="M58 30 L46 56"/>' +
          '<path d="M56 34 L36 38 L26 52"/>' +
          '<path d="M56 34 L74 44 L88 36"/>' +
          '<path d="M46 56 L68 64 L66 90"/>' +
          '<path d="M46 56 L30 72 L10 68"/>' +
          "</g>",
        basquete:
          '<circle cx="50" cy="50" r="42" fill="#f08a24" stroke="#111" stroke-width="4"/>' +
          '<path d="M50 8 V92 M8 50 H92 M20 18 C40 36 40 64 20 82 M80 18 C60 36 60 64 80 82" stroke="#111" stroke-width="3"/>',
        volei:
          '<circle cx="50" cy="50" r="42" fill="#fff" stroke="#1d4ed8" stroke-width="4"/>' +
          '<path d="M50 8 C42 30 44 48 8 56 C14 72 24 82 30 88 C40 62 60 62 70 88 C76 82 86 72 92 56 C56 48 58 30 50 8 Z" fill="#fcd116" stroke="#1d4ed8" stroke-width="3"/>',
        tenis:
          '<circle cx="50" cy="50" r="42" fill="#d4e157" stroke="#5c6b0a" stroke-width="4"/>' +
          '<path d="M12 26 C40 40 40 60 12 74 M88 26 C60 40 60 60 88 74" stroke="#fff" stroke-width="5"/>',
        ginastica:
          '<g stroke="#9b1f5f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">' +
          '<circle cx="50" cy="20" r="9" fill="#9b1f5f" stroke="none"/>' +
          '<path d="M50 34 L50 58"/>' +
          '<path d="M50 38 L28 20 M50 38 L72 20"/>' +
          '<path d="M50 58 L12 66 M50 58 L88 66"/>' +
          "</g>" +
          '<path d="M72 20 C84 8 92 22 82 30 C74 36 82 46 92 40" stroke="#f5a800" stroke-width="4" stroke-linecap="round"/>',
        natacao:
          '<circle cx="70" cy="34" r="9" fill="#1976d2" stroke="none"/>' +
          '<path d="M18 52 C32 26 52 28 62 44 L84 50" stroke="#1976d2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>' +
          '<path d="M8 72 Q18 63 28 72 T48 72 T68 72 T88 72 M8 88 Q18 79 28 88 T48 88 T68 88 T88 88" stroke="#1976d2" stroke-width="5" stroke-linecap="round"/>',
        golfe:
          '<path d="M30 10 V76" stroke="#111" stroke-width="4" stroke-linecap="round"/>' +
          '<polygon points="30,10 64,23 30,36" fill="#e5383b" stroke="none"/>' +
          '<path d="M6 86 Q50 70 94 86" stroke="#2e8b3a" stroke-width="6" stroke-linecap="round"/>' +
          '<circle cx="68" cy="68" r="12" fill="#fff" stroke="#111" stroke-width="3.5"/>' +
          '<circle cx="64" cy="65" r="1.6" fill="#111" stroke="none"/><circle cx="71" cy="64" r="1.6" fill="#111" stroke="none"/>' +
          '<circle cx="67" cy="71" r="1.6" fill="#111" stroke="none"/>',
        judo:
          '<path d="M30 14 L50 24 L70 14 L90 30 L80 54 L70 48 L70 90 L30 90 L30 48 L20 54 L10 30 Z" fill="#fff" stroke="#111" stroke-width="4" stroke-linejoin="round"/>' +
          '<path d="M30 14 L50 54 L70 14" stroke="#111" stroke-width="3.5"/>' +
          '<rect x="28" y="62" width="44" height="10" fill="#111" stroke="none"/>' +
          '<path d="M50 72 L44 86 M50 72 L56 86" stroke="#111" stroke-width="4" stroke-linecap="round"/>',
        estrela:
          '<path d="M50 4 L58 40 L96 50 L58 60 L50 96 L42 60 L4 50 L42 40 Z"/>' +
          '<path d="M50 16 L55 44 L84 50 L55 56 L50 84 L45 56 L16 50 L45 44 Z" opacity=".55"/>' +
          '<path d="M22 22 L78 78 M78 22 L22 78" opacity=".8"/>',
      };

      function iconeDaAtleta(a) {
        const limpo = (t) =>
          String(t || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");
        if (a.icone && ICONES[a.icone]) return a.icone;
        const linha = (a.dados || []).find((d) => limpo(d[0]) === "modalidade");
        const texto = limpo(linha ? linha[1] : (a.tags || [])[0]);
        const mapa = [
          ["handebol", "handebol"],
          ["futebol", "futebol"],
          ["atletismo", "atletismo"],
          ["basquete", "basquete"],
          ["volei", "volei"],
          ["tenis", "tenis"],
          ["ginastica", "ginastica"],
          ["natacao", "natacao"],
          ["golfe", "golfe"],
          ["judo", "judo"],
        ];
        const achou = mapa.find((m) => texto.includes(m[0]));
        return achou ? achou[1] : "estrela";
      }

      function iconeSVG(nome) {
        return (
          '<svg viewBox="0 0 100 100" aria-hidden="true">' +
          (ICONES[nome] || ICONES.estrela) +
          "</svg>"
        );
      }

      function organizarGaleria(caixa) {
        const colagem = caixa.querySelector(".colagem");
        const todas = [...colagem.querySelectorAll("figure")];
        const ok = todas.filter((f) => f.dataset.ok === "1");
        todas.forEach((f) => {
          f.className = "";
          f.hidden = f.dataset.ok !== "1";
        });
        colagem.className = "colagem n" + Math.max(ok.length, 1);
        ok.forEach((f, i) => {
          f.classList.add("p" + (i + 1));
          // com 1 foto ela vira polaroid; com mais, a 2ª é a polaroid
          if (i === (ok.length === 1 ? 0 : 1)) f.classList.add("polaroid");
        });
        caixa.hidden = ok.length === 0;
      }

      function galeria(a, reservas) {
        const semExt = a.foto.replace(/\.[a-z0-9]+$/i, "");
        const lista = (
          a.galeria && a.galeria.length
            ? a.galeria
            : [2, 3, 4].map((n) => semExt + "-" + n + ".jpg")
        ).slice(0, 4);

        const caixa = el("aside", "galeria");
        caixa.hidden = true;
        caixa.setAttribute("aria-label", "Mais fotos de " + a.nome);
        if (a.recorte) caixa.classList.add("apos-recorte");

        const colagem = el("div", "colagem n1");
        caixa.append(colagem);

        lista.forEach((item) => {
          const info = typeof item === "string" ? { src: item } : item;
          const raiz = info.src.replace(/\.[a-z0-9]+$/i, "");
          let tentativas = [info.src]
            .concat(EXTENSOES.map((e) => raiz + "." + e))
            .filter((s, i, todas) => todas.indexOf(s) === i);
          if (MODO_DEMO) tentativas = tentativas.concat(reservas || []);

          const fig = el("figure");
          fig.hidden = true;
          const img = el("img");
          img.alt = info.alt || "Foto de " + a.nome;
          let t = 0;
          img.onerror = () => {
            t++;
            if (t < tentativas.length) {
              img.src = tentativas[t];
            } else {
              fig.remove();
              organizarGaleria(caixa);
            }
          };
          img.onload = () => {
            fig.dataset.ok = "1";
            organizarGaleria(caixa);
          };
          img.src = tentativas[0];
          fig.append(img);
          colagem.append(fig);
        });

        // enfeites da colagem (ícones da modalidade e papel rasgado)
        const papel = el("span", "deco deco-papel");
        const e1 = el("span", "deco deco-estrela amarela");
        const e2 = el("span", "deco deco-estrela magenta");
        const icone = iconeDaAtleta(a);
        e1.innerHTML = iconeSVG(icone);
        e2.innerHTML = iconeSVG(icone);
        [papel, e1, e2].forEach((d) => {
          d.setAttribute("aria-hidden", "true");
          colagem.append(d);
        });

        return caixa;
      }

      /* ---------- FONTES NO FIM DA PÁGINA ---------- */
      // Dados em fontes.js (window.FONTES[id]); se não houver, usa a.fontes.
      function fontesFinal(a) {
        const extra = (window.FONTES || {})[id] || {};
        const fontes = (extra.fontes || a.fontes || []).filter(
          (f) => (typeof f === "string" ? f : f.texto) !== "[PREENCHER]",
        );
        const tambem = extra.tambem || a.tambem || [];
        const sec = el("section", "fontes-final");
        if (!fontes.length && !tambem.length) return sec;

        const selo = el("span", "ff-selo");
        selo.innerHTML = iconeSVG(iconeDaAtleta(a));
        selo.setAttribute("aria-hidden", "true");
        sec.append(
          el("div", "ff-topo", "", [
            selo,
            el("div", "", "", [
              el("h2", "", "Fontes"),
              el("p", "ff-sub", "Onde pesquisamos a história de " + a.nome),
            ]),
          ]),
        );

        if (fontes.length) {
          const lista = el("ol", "ff-lista");
          fontes.forEach((f, i) => {
            const item = typeof f === "string" ? { texto: f } : f;
            // sem link definido, abre uma busca pelo título exato da fonte
            const destino =
              item.link && item.link !== "#"
                ? item.link
                : "https://www.google.com/search?q=" +
                  encodeURIComponent('"' + item.texto + '"');
            const conteudo = el("a", "", item.texto);
            conteudo.href = destino;
            conteudo.target = "_blank";
            conteudo.rel = "noopener";
            lista.append(
              el("li", "ff-ingresso", "", [
                el("span", "ff-num", String(i + 1).padStart(2, "0")),
                el("div", "ff-texto", "", [conteudo]),
              ]),
            );
          });
          sec.append(lista);
        }

        if (tambem.length) {
          sec.append(el("h3", "ff-titulo2", "Elas também fazem história"));
          const grade = el("div", "ff-grade");
          tambem.forEach((t) =>
            grade.append(
              el("div", "ff-camisa", "", [
                el("strong", "", t.nome),
                el("p", "", t.texto),
              ]),
            ),
          );
          sec.append(grade);
        }
        return sec;
      }

      /* ---------- CAMINHOS DAS FOTOS (corrige os arquivos de dados) ---------- */
      // Nome real dos arquivos em dados/fotos/ para cada atleta.
      // principal = foto grande; base = prefixo da galeria (base-2, base-3, base-4).
      const FOTOS = {
        "aida-dos-santos": { principal: "aida", base: "aida" },
        "alexandra-nascimento": { principal: "alex", base: "alex" },
        "beatriz-souza": { principal: "bratriz", base: "beatriz" },
        "fabiana-claudino": { principal: "fabiana", base: "fabiana" },
        formiga: { principal: "formiga", base: "formiga" },
        "rebeca-andrade": { principal: "rebeca", base: "rebeca" },
        "renee-powell": { principal: "renee", base: "renee" },
        "serena-williams": { principal: "serena", base: "serena" },
        "sheryl-swoopes": { principal: "sheryl", base: "sheryl" },
        "simone-biles": { principal: "simoneb", base: "simoneb" },
        "simone-manuel": { principal: "simonem", base: "simonem" },
      };

      function corrigirFotos(a, idAtleta) {
        const f = FOTOS[idAtleta];
        if (f) {
          a.foto = "dados/fotos/" + f.principal + ".png";
          // usa a lista do arquivo de dados só se ela já apontar para dados/fotos/
          const primeira = a.galeria && a.galeria[0];
          const caminho = primeira && (primeira.src || primeira);
          if (!(caminho && String(caminho).includes("dados/fotos/"))) {
            a.galeria = [2, 3, 4].map(
              (n) => "dados/fotos/" + f.base + "-" + n + ".png",
            );
          }
        } else if (a.foto) {
          // atleta nova: só tira a barra do começo (/dados/... vira dados/...)
          a.foto = a.foto.replace(/^\/+/, "");
        }
      }

      function montar(a) {
        corrigirFotos(a, id);
        document.title = a.nome + " | Mulheres Negras no Esporte";
        pagina.replaceChildren();

        const partes = a.nome.split(" ");
        const ultimo = partes.pop();
        const primeiro = partes.join(" ");

        /* ---------- TOPO ---------- */
        const colEsq = el("div", "col", "", [
          el("h2", "", "Modalidade"),
          el(
            "div",
            "chips",
            "",
            a.tags.map((t) => el("span", "chip", t)),
          ),
          el("h2", "", "Ficha"),
          ...a.dados.map((d) =>
            el("div", "dado", "", [el("strong", "", d[0]), d[1]]),
          ),
        ]);

        const colDir = el("div", "col", "", [el("h2", "", "Destaques")]);

        if (a.quadro) {
          const q = quadroMedalhas(a.quadro);
          if (q) colDir.append(q);
        }
        a.destaques.forEach((c) => {
          const m = c.medalha ? medalha(c.medalha) : null;
          const texto = el("div", "marco-texto", "", [
            el("p", "linha", c.ano + " | " + c.titulo),
            el("p", "sub", c.detalhe),
          ]);
          colDir.append(
            el(
              "div",
              "marco" + (m ? " com-medalha" : ""),
              "",
              m ? [m, texto] : [texto],
            ),
          );
        });

        pagina.append(el("section", "topo", "", [colEsq, colDir]));

        /* ---------- NOME GIGANTE + FOTO ---------- */
        const foto = el("img", "foto" + (a.recorte ? " recorte" : ""));
        foto.alt = "Foto de " + a.nome;
        const raizFoto = a.foto.replace(/\.[a-z0-9]+$/i, "");
        const tentFoto = [a.foto]
          .concat(EXTENSOES.map((e) => raizFoto + "." + e))
          .filter((x, i, todas) => todas.indexOf(x) === i);
        let tf = 0;
        foto.onerror = () => {
          tf++;
          if (tf < tentFoto.length) foto.src = tentFoto[tf];
        };
        foto.src = tentFoto[0];

        pagina.append(
          el("section", "nome-bloco", "", [
            el("h1", "nome", "", [
              el("span", "primeiro", "", [el("span", "txt", primeiro)]),
              el("span", "ultimo", "", [el("span", "txt", ultimo)]),
            ]),
            foto,
          ]),
        );

        /* ---------- BASE ---------- */
        const resumo = el("div", "col-base", "", [
          el("h2", "", "Resumo"),
          el("p", "", a.resumo),
        ]);

        const anedota = el("div", "anedota", "", [
          el("span", "adesivo", "Você sabia?"),
          el("p", "", a.curiosidade),
        ]);

        const pergunta = el("div", "pergunta", "", [
          el(
            "p",
            "",
            "O esporte oferece as mesmas oportunidades para todas as pessoas?",
          ),
          el(
            "small",
            "",
            "O racismo e o machismo ainda dificultam o acesso, a permanência e o reconhecimento das mulheres negras.",
          ),
        ]);

        pagina.append(
          el("section", "base", "", [
            el("div", "base-grid", "", [resumo]),
            anedota,
            pergunta,
            galeria(a, tentFoto),
          ]),
        );

        /* ---------- HISTÓRIA COMPLETA ---------- */
        const historia = el("section", "historia", "", [
          el("h2", "", "História completa"),
        ]);

        a.secoes.forEach((s, i) => {
          const corpo = el("div", "corpo");
          s.blocos.forEach((b) => {
            if (typeof b === "string") {
              corpo.append(paragrafo(b));
            } else if (Array.isArray(b)) {
              const ul = el("ul");
              b.forEach((item) => {
                const li = el("li");
                rico(item, li);
                ul.append(li);
              });
              corpo.append(ul);
            } else if (b.h) {
              corpo.append(el("h4", "", b.h));
            }
          });
          const d = el("details", "", "", [el("summary", "", s.titulo), corpo]);
          if (i === 0) d.open = true;
          historia.append(d);
        });

        if (a.frase) {
          const f = el("div", "frase-final");
          rico(a.frase, f);
          historia.append(f);
        }

        pagina.append(historia);
        pagina.append(fontesFinal(a));

        ajustarNome();
        if (document.fonts) {
          document.fonts.load("1em Anton").then(ajustarNome, ajustarNome);
          document.fonts.ready.then(ajustarNome);
        }
      }
      /* ---------- CARREGA SÓ A ATLETA DO QR CODE ---------- */
      const id = new URLSearchParams(window.location.search).get("id") || "";
      if (!/^[a-z0-9-]+$/.test(id)) {
        naoEncontrada();
      } else {
        const s = document.createElement("script");
        s.src = "dados/" + id + ".js";
        s.onload = () =>
          window.ATLETA ? montar(window.ATLETA) : naoEncontrada();
        s.onerror = naoEncontrada;
        document.body.append(s);
      }
    </script>
  </body>
</html>
